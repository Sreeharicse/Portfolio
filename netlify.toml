[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/Html/Mainpage.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/Html/Mainpage.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
