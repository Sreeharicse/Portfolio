[build]
  publish = "."

# SPA-style redirect - serves the HTML file for all routes
# This works with Netlify Forms because forms use a different endpoint
[[redirects]]
  from = "/*"
  to = "/Html/Mainpage.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
